<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Local Offline RAG workflow</title><desc id="desc">The Streamlit app ingests documents, chunks text, builds a local FAISS index, retrieves relevant passages, and uses a local GGUF model to respond.</desc><rect width="1200" height="400" rx="18" fill="#F0F4EF"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#3D7858">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#26362B">Local Offline RAG</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6C7A6F">Local documents to context-grounded answers</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#D5E0D5"/><path d="M 300 237 L 330 237" stroke="#6C7A6F" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#6C7A6F" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#6C7A6F" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#6C7A6F" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#6C7A6F" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#6C7A6F" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D5E0D5" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#3D7858"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#3D7858">01 / INGEST</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#26362B">Read source files</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6C7A6F">Extract text from supported documents.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D5E0D5" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#6E8DAC"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#6E8DAC">02 / CHUNK + INDEX</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#26362B">Create local vectors</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6C7A6F">Build and persist a FAISS index.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D5E0D5" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#AF8A4B"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#AF8A4B">03 / RETRIEVE</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#26362B">Search by meaning</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6C7A6F">Find relevant document passages.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D5E0D5" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#3D7858"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#3D7858">04 / GENERATE</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#26362B">Local GGUF model</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6C7A6F">Answer from the retrieved context.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#3D7858">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6C7A6F">Keep the model and vector index local; inspect source passages to validate answers.</text></svg>